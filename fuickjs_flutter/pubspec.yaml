name: fuickjs_flutter
description: "FuickJS Flutter 框架层 — React + QuickJS + Flutter 动态化渲染框架的 Flutter 端：DSL 解析、Widget 工厂、Native 服务、Bundle 动态下发。"
version: 0.1.0
homepage: https://github.com/fuickjs/fuickjs

environment:
  sdk: ^3.6.0
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  fjs_engine: #^0.0.2
    path: ../../fuickjs_core
  easy_isolate: ^1.0.1
  cached_network_image: ^3.4.1
  web_socket_channel: ^3.0.1
  dio: ^5.7.0
  archive: ^4.0.4
  path: ^1.9.0
  crypto: ^3.0.6
  cryptography: ^2.7.0
  flutter_svg: ^2.0.16
  #  collection: ^1.19.1
  path_provider: ^2.1.2
  logger: ^2.6.2
  url_launcher: ^6.2.0
  connectivity_plus: ^6.0.0
  shared_preferences: ^2.3.3
  source_maps: ^0.10.13
  synchronized: ^3.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

